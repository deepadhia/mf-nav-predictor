name: Mutual Fund Intraday NAV Alert

# NOTE: Scheduled cron is disabled on GitHub Actions.
# Automated scheduling is handled with 100% precision on your dedicated Oracle Cloud instance.
# Manual trigger via workflow_dispatch remains available.
on:
  # schedule:
  #   - cron: '50 7 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub web / mobile app if ever needed

jobs:
  check-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run NAV Predictor
        env:
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          USE_YFINANCE_FALLBACK: "true"
          TELEGRAM_ENABLED: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py
